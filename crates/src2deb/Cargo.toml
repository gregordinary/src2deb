[package]
name = "src2deb"
description = "Build Debian .deb packages from source in an unprivileged sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# This test reads the recipes at the repository root, which are not part of the
# crate. It belongs to the repository rather than to the published library, so
# it is left out rather than shipped as a test that cannot run.
exclude = ["tests/shipped_recipes.rs"]

[dependencies]
ferroday-cage.workspace = true
rustix.workspace = true
serde.workspace = true
# Also what the integration tests measure a release archive with, to declare the
# digest that pins it the way a recipe author would. A test target sees the
# normal dependencies, so that needs no separate dev-dependency.
sha2.workspace = true
toml.workspace = true

[lints]
workspace = true
