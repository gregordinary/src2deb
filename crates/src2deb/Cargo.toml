[package]
name = "src2deb"
description = "Build Debian .deb packages from source in an unprivileged sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# This test reads the recipes at the repository root, which are not part of the
# crate. It belongs to the repository rather than to the published library, so
# it is left out rather than shipped as a test that cannot run.
exclude = ["tests/shipped_recipes.rs"]

[dependencies]
ferroday-cage.workspace = true
rustix.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
# The integration tests build release archives and declare the digests that pin
# them, which means measuring one the way a recipe author would.
sha2.workspace = true

[lints]
workspace = true
