# COSMIC desktop (cosmic-epoch) build recipe.
#
# Generated from github.com/pop-os/cosmic-epoch. Each component is its own
# Debian source package (its own debian/ tree); src2deb reads each
# debian/control to discover build-deps and compute the build order, so the
# order below does not matter. git-ref values are cosmic-epoch's pinned
# submodule commits (reproducible); set a ref to "master" for latest.
#
# NOTE: the COSMIC Debian build graph is essentially flat -- only cosmic-osd
# build-depends on another component (cosmic-randr). Every other component
# builds independently. Builds vendor Rust crates (cargo/just) and expect a
# vendor.tar prepared before an offline build; see README.md.
#
# No architectures are named, so the recipe builds for whichever host runs it.
# Pass --architecture to target another one, or repeat it to build for several
# in one run.

name = "cosmic-epoch"
suite = "trixie"

# What the pool's Release declares itself to be. `apt policy` renders these, and
# an apt pin matches on the first two, so a pool that names them can be pinned
# the way apt's own documentation leads with.
#
# These three recipes are built into one pool, so they name one identity: the
# pool has a single Release, and the last recipe to publish writes it.
origin = "Texor"
label = "COSMIC for Debian"
description = "COSMIC desktop packages for Debian"

# COSMIC needs a newer Rust than trixie's archive ships (`let_chains` and other
# recently stabilized features), so the build root installs a pinned rustup
# toolchain rather than using the archive's rustc.
[toolchain.rust]
provider = "rustup"
version = "1.97.0"

